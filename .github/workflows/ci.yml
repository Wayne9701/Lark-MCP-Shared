name: macOS deterministic acceptance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Business, runtime, auth and portability tests
        run: npm test
      - name: Public source scan
        run: npm run scan
      - name: Fresh isolated install and official CLI verification
        run: npm run test:isolated-install
